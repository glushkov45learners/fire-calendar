# Fire Calendar stack: PostGIS + API + Caddy (HTTPS, frontend static, /api proxy).
#
#   cp .env.example .env    # set POSTGRES_PASSWORD
#   mkdir -p web            # frontend build goes here (index.html at web/index.html)
#   docker compose up -d
#   ./load_hotspots.sh
#
# The database schema belongs to the backend: the API applies it on every start.
name: fire-calendar

services:
  postgis:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: fire
      POSTGRES_USER: fire
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      # Published on localhost only: reach it from outside through an SSH tunnel.
      - "${PG_BIND:-127.0.0.1}:${PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fire -d fire"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: voloshmiak/fire-calendar-backend:${API_TAG:-0.1.4}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://fire:${POSTGRES_PASSWORD}@postgis:5432/fire
    depends_on:
      postgis: { condition: service_healthy }

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]

  web:
    image: voloshmiak/fire-calendar-frontend:${WEB_TAG:-0.1.3}
    restart: unless-stopped


volumes:
  pgdata: {}
  caddy_data: {}
  caddy_config: {}
